{% extends "base.html" %}
{% block content %}
<h1>Users</h1>
<form class="card filters" method="get">
  <div><label>Role</label><select name="role"><option value="">All</option>
    {% for v, l in roles %}<option value="{{ v }}" {% if role == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div><button class="btn">Filter</button></div>
</form>
<div class="card"><table>
  <thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Active</th><th></th></tr></thead>
  {% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.email }}</td><td>{{ u.get_role_display }}</td>
    <td>{{ u.is_active|yesno:"Yes,No" }}</td><td><a href="{% url 'claims:panel_user_edit' u.pk %}">Edit</a></td></tr>{% endfor %}
</table></div>
{% endblock %}
